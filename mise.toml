[tasks.build]
alias = "b"
run = "cargo build --release"
silent = true

[tasks.dublette]
alias = "d"
depends = "build"
description = "Run dublette"
raw = true
run = "{{ vars.dublette }}"
silent = true

[tasks.test]
alias = "t"
run = "cargo nextest run"

[tools]
"cargo:cargo-nextest" = "0.9.148"
"cargo:convco" = "0.7.2"
"aqua:dprint/dprint" = "0.61.1"
hk = "2.5.0"
node = "24.21.0"
pkl = "0.32.1"
rust = "1.99.0"

[vars]
dublette = "target/release/dublette"
