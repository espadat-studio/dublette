[tasks.build]
alias = "b"
run = "cargo build --release"
silent = true

[tasks.dublette]
alias = "d"
depends = "build"
description = "Run dublette"
raw = true
run = "{{ vars.dublette }}"
silent = true

[tasks.test]
alias = "t"
run = "cargo nextest run"

[tools]
"cargo:cargo-nextest" = "0.9.152"
"cargo:convco" = "0.7.2"
"aqua:dprint/dprint" = "0.65.0"
hk = "2.13.0"
node = "26.13.1"
pkl = "0.33.1"
rust = "1.100.0"

[vars]
dublette = "target/release/dublette"
