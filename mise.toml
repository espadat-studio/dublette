[tasks.build]
alias = "b"
run = "cargo build --release"
silent = true

[tasks.dublette]
alias = "d"
depends = "build"
description = "Run dublette"
raw = true
run = "{{ vars.dublette }}"
silent = true

[tasks.test]
alias = "t"
run = "cargo nextest run"

[tools]
"cargo:cargo-nextest" = "0.9.149"
"cargo:convco" = "0.7.2"
"aqua:dprint/dprint" = "0.64.3"
hk = "2.7.1"
node = "24.22.1"
pkl = "0.32.2"
rust = "1.99.1"

[vars]
dublette = "target/release/dublette"
